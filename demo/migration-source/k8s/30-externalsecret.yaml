apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
  namespace: talhas-experiments
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: talhas-aws-sm
    kind: SecretStore
  target:
    name: web-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: talhas/app-secrets
