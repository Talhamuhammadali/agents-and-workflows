apiVersion: poc.local/v1alpha1
kind: WorkloadPlan
metadata:
  name: test-deploy-crash
spec:
  intent: provision
  components:
    - name: crasher
      manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: crasher
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: crasher
          template:
            metadata:
              labels:
                app: crasher
            spec:
              containers:
                - name: crasher
                  image: busybox:1.36
                  command: ["sh", "-c", "exit 1"]
