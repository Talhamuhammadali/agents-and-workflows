[project]
name = "agents-and-workflows"
version = "0.1.0"
description = "A project for exploring AI agents and workflows using LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.4.0",
    "langchain-azure-ai>=1.2.1",
    "langchain-google-genai>=4.2.1",
    "langchain-google-vertexai>=3.2.2",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-redis>=0.4.0",
    "langgraph-cli[inmem]>=0.4.19",
    "langgraph-sdk>=0.3.12",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.8",
]

[tool.mypy]
exclude = ["experiments/*", "tests/*"]
python_version = 3.12
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "aiofiles.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true


[tool.ruff]
line-length = 120
extend-exclude = ["experiments/*", "tests/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
