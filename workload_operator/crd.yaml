apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloadplans.poc.local
spec:
  group: poc.local
  scope: Cluster
  names:
    kind: WorkloadPlan
    plural: workloadplans
    singular: workloadplan
    shortNames: [wp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Intent
          type: string
          jsonPath: .spec.intent
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Children
          type: integer
          jsonPath: .status.readyCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [components]
              properties:
                intent:
                  type: string
                  enum: [migrate, provision]
                components:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, manifest]
                    properties:
                      name:
                        type: string
                      manifest:
                        type: object
                        required: [apiVersion, kind, metadata]
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          apiVersion:
                            type: string
                          kind:
                            type: string
                          metadata:
                            type: object
                            required: [name]
                            x-kubernetes-preserve-unknown-fields: true
                            properties:
                              name:
                                type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Failed]
                observedGeneration:
                  type: integer
                readyCount:
                  type: integer
                children:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      kind:
                        type: string
                      namespace:
                        type: string
                      apiVersion:
                        type: string
                      objectName:
                        type: string
                      ready:
                        type: boolean
                      failed:
                        type: boolean
                      note:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
