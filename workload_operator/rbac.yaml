apiVersion: v1
kind: Namespace
metadata:
  name: workload-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-operator
  namespace: workload-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-operator-cluster
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  - apiGroups: [poc.local]
    resources: [workloadplans, workloadplans/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, pods, serviceaccounts]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create, get, list, watch, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-operator-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-operator-cluster
subjects:
  - kind: ServiceAccount
    name: workload-operator
    namespace: workload-operator-system
