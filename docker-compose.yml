services:
  redis:
    image: redis/redis-stack:latest
    container_name: agents-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agents-net

  backend:
    build:
      context: .
      dockerfile: ui/backend/Dockerfile
    container_name: agents-backend
    # Reload only on source changes — excludes tests/workspaces/* so agent
    # file writes during a stream don't trigger a server restart.
    command: >
      uvicorn ui.backend.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir ui/backend
      --reload-dir agentic_patterns
      --reload-dir helpers
      --reload-dir utils
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - backend_venv:/app/.venv
      - ${HOME}/.kube:/host/.kube:ro
      - ${HOME}/.minikube:${HOME}/.minikube:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agents-net
      - minikube

  frontend:
    build:
      context: ui/frontend
      dockerfile: Dockerfile
    container_name: agents-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./ui/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - agents-net

networks:
  agents-net:
    driver: bridge
  minikube:
    external: true

volumes:
  redis_data:
  backend_venv:
  frontend_node_modules:
